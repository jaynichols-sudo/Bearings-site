name: Deploy to Cloudflare Pages

# Publishes the site to Cloudflare Pages on every push to main, once the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are added to this repo.
# Until then it skips quietly (GitHub Pages can serve the site meanwhile).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare secrets
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repo's secrets to publish on Cloudflare Pages."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the pages
        if: steps.ready.outputs.go == 'true'
        run: |
          python3 scripts/build-pages.py
          mkdir dist
          rsync -a --exclude '.git*' --exclude scripts --exclude content --exclude README.md --exclude site.json --exclude sitepw ./ dist/
      - name: Create the Pages project (first run only)
        if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create northfix --production-branch main || true
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name northfix --branch main --commit-dirty=true | tee deploy.log
          echo "::notice title=Deployed::$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1) (add your custom domain in Cloudflare: Workers & Pages > northfix > Custom domains)"
